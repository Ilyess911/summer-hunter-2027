# Transparent scoring rules. Every number here is a heuristic, editable by hand.

weights:
  career_alignment: 0.30
  experience_relevance: 0.25
  mission_quality: 0.20
  skill_development: 0.15
  long_term_value: 0.10

# Job families, matched against the title in order (first match wins).
# alignment is the base career-alignment score of the family.
job_families:
  # Explicit business intent is matched first, in its original relative order, so "Maintenance Sales" or
  # "Product Project Manager" keep their business family.
  - {id: technical_sales, tier: 1, alignment: 96, patterns: ['sales engineer', 'solutions? engineer', 'solutions? consultant', 'technical sales', 'pre-?sales', 'customer engineer', 'solutions? architect intern', 'value engineer']}
  - {id: enterprise_sales, tier: 1, alignment: 92, patterns: ['enterprise sales', 'account executive', 'enterprise account', 'strategic account', 'key account', 'technical business development']}
  - {id: robotics_specialized, tier: 0, alignment: 30, track: industry_robotics, category: Robotics (specialized engineering),
     patterns: ['robotics (software|research|perception|controls?|hardware)', 'robotics engineer\b', '\brobot(ic)? perception', 'perception (algorithms?|stack|systems?|engineer)', '\bslam\b', '\bros ?2?\b', 'motion planning', 'computer vision', 'controls? engineer']}
  - {id: software_engineering, tier: 0, alignment: 8, patterns: ['software engineer', 'infrastructure engineer', 'site reliability', '(integration|software|platform|service) reliability', 'data engineer', 'ml engineer', 'machine learning engineer', 'developer', '\bswe\b', 'backend', 'frontend', 'full[- ]stack']}
  - {id: product_marketing, tier: 2, alignment: 88, patterns: ['product marketing', '\bapmm\b', 'associate product marketing']}
  - {id: go_to_market, tier: 2, alignment: 87, patterns: ['go-?to-?market', '\bgtm\b', 'product strategy', 'strategic partnerships?', 'partnerships?', 'alliances', 'business development', 'commercial excellence']}
  - {id: sales_development, tier: 2, alignment: 50, patterns: ['sales development', '\bsdr\b', '\bbdr\b', 'inside sales', 'lead generation']}
  - {id: sales_general, tier: 2, alignment: 72, patterns: ['\bsales\b']}
  - {id: product_management, tier: 3, alignment: 80, patterns: ['product manag', '\bapm\b', 'associate product manager', 'ai product', 'product owner', 'product project manag']}
  - {id: marketing_general, tier: 0, alignment: 40, patterns: ['account manag']}
  # --- Track B: industry & robotics (added 23 Oct 2026). Listed first so "engineer" or "operations"
  # in these titles is not caught by the business or out-of-scope families below.
  - {id: design_engineering, tier: 0, alignment: 15, category: Other,
     patterns: ['industrial design', 'product design', 'mechanical design', 'hardware design', 'design engineer', 'cad designer']}
  - {id: robotics_raas, tier: 1, alignment: 92, track: industry_robotics, category: Robotics,
     patterns: ['robotics? (operations|deployment|implementation|integration|customer|solutions?|service|fleet|program|project|business|field|technical sales|sales|commercial|application)',
                'robotics as a service', '\braas\b', 'robot deployment', 'automation solutions?', 'autonomous mobile robot', '\bamrs?\b',
                'warehouse automation', 'logistics automation']}
  - {id: maintenance_reliability, tier: 1, alignment: 94, track: industry_robotics, category: Maintenance,
     patterns: ['maintenance', '(?<!site )(?<!integration )(?<!software )(?<!platform )(?<!database )(?<!data )(?<!service )reliability (engineer|engineering|intern)', 'asset (integrity|reliability|performance|management engineer)',
                '\bmro\b', 'fleet (maintenance|technical)', 'technical services?', 'aftermarket', 'field service', 'airworthiness', 'continuing airworthiness']}
  - {id: industrial_project_management, tier: 1, alignment: 93, track: industry_robotics, category: Industrial Project Management,
     patterns: ['industrial project', 'engineering project', 'technical project', 'project coordinat', 'manufacturing project', 'operations project',
                'industrial program', 'engineering program manag', 'project engineer', 'industriali[sz]ation', 'technical operations',
                'project manag', '\bpmo\b', 'npi project', 'new product introduction']}
  - {id: industrial_digital, tier: 2, alignment: 88, track: industry_robotics, category: Industrial Digitalization,
     patterns: ['industry 4\.?0', 'smart (manufacturing|factory|factories)', 'industrial (digital|ai|iot|automation|innovation|analytics|data)',
                'digitali[sz]ation', 'manufacturing (analytics|digital|data)', '\biiot\b', 'digital (operations|manufacturing|factory|twin)',
                'automation project', 'operational technology', 'predictive maintenance analytics']}
  - {id: industrial_operations, tier: 2, alignment: 87, track: industry_robotics, category: Industrial Operations,
     patterns: ['operations? excellence', 'operational excellence', 'continuous improvement', '\blean\b', 'six sigma',
                'manufacturing (operations|engineering|strategy|intern)', 'industrial (operations|performance|engineering)', 'process (improvement|engineer|excellence)',
                'production (planning|engineer|operations)', 'supply chain (project|operations|engineer|planning|analyst)',
                'plant (operations|engineer)', 'industrial data analyst']}
  # --- Track A: business & technology.
  - {id: ai_solutions, tier: 3, alignment: 80, patterns: ['ai solutions?', 'ai deployment', 'forward deployed', 'deployment strateg', 'ai strategy']}
  - {id: program_management, tier: 3, alignment: 74, patterns: ['technical program manag', '\btpm\b', 'program manag']}
  - {id: commercial_strategy, tier: 3, alignment: 76, patterns: ['commercial strategy', 'sales strategy', 'revenue operations', '\brevops\b', 'sales operations', 'business operations', 'bizops', 'strategy & operations', 'strategy and operations']}
  - {id: strategy_consulting, tier: 4, alignment: 62, patterns: ['strategy analyst', 'business analyst', 'digital transformation', 'technology consult', 'consulting', 'innovation', 'corporate strategy', 'strategy intern', 'strategy']}
  - {id: marketing_general, tier: 0, alignment: 40, patterns: ['marketing', 'growth', 'customer success', 'account manag']}
  # Track B catch-alls, after the business families so "Manufacturing Sales Intern" stays a sales role.
  - {id: robotics_raas, tier: 1, alignment: 88, track: industry_robotics, category: Robotics, patterns: ['robotics', '\brobots?\b']}
  - {id: industrial_operations, tier: 2, alignment: 82, track: industry_robotics, category: Industrial Operations,
     patterns: ['industrial', 'manufacturing', 'supply chain', 'logistics', 'operations engineer']}
  - {id: data_analytics, tier: 0, alignment: 30, patterns: ['data analy', 'analytics', 'data science', 'data scien']}
  - {id: out_of_scope, tier: 0, alignment: 8, patterns: ['software', 'developer', '\bswe\b', 'engineer', 'research', 'scientist', '\brtl\b', 'asic', '\bdft\b', 'hardware', 'firmware', 'verification', 'design', 'finance', 'accounting', 'legal', 'recruit', 'talent', '\bhr\b', 'people', 'tax', 'audit', 'security', 'mechanical', 'electrical']}

default_family: {id: unclassified, tier: 0, alignment: 35}

# Two parallel career tracks. Families without `track` belong to business_tech.
# category: label shown in Telegram, the Mini App and the CRM (families without one use these).
tracks:
  business_tech:
    label: BUSINESS & TECHNOLOGY
    categories: {technical_sales: Technical Sales, enterprise_sales: Technical Sales, sales_general: Technical Sales,
                 sales_development: Business Development, go_to_market: Business Development,
                 product_marketing: Product Marketing, product_management: Product Management, ai_solutions: Product Management,
                 program_management: Product Management, commercial_strategy: Business Development,
                 strategy_consulting: Strategy, marketing_general: Other, data_analytics: Other,
                 software_engineering: Other, out_of_scope: Other, unclassified: Other}
  industry_robotics:
    label: INDUSTRY & ROBOTICS

# Track-specific "career positive" signals (replace career_positive_signals for that track).
track_signals:
  industry_robotics:
    points_each: 3
    max_points: 12
    keywords: [project coordination, industrial planning, cross-functional, performance monitoring, process improvement,
               stakeholder management, project reporting, budget monitoring, deployment, technical documentation,
               preventive maintenance, predictive maintenance, maintenance planning, reliability, kpi, cmms, gmao,
               equipment lifecycle, lean, continuous improvement, cost reduction, production planning, customer onboarding,
               implementation, fleet performance, service delivery, requirements analysis, digitalization, dashboards,
               decision support, automation]

# Recruitability: how closely the verified profile matches the actual requirements (0-100).
# It is NOT a probability of being hired. Weights are editable.
recruitability:
  weights: {direct_experience: 0.30, technical_skills: 0.25, academic: 0.20, transferable: 0.15, industry: 0.10}
  # Which verified experiences are direct evidence for which families (rule, not a profile fact).
  experience_families:
    air_france_industries: [maintenance_reliability, industrial_project_management, industrial_digital, industrial_operations,
                            robotics_raas, program_management, ai_solutions, commercial_strategy, technical_sales]
    airbus_helicopters: [industrial_operations, industrial_project_management, maintenance_reliability, robotics_raas]
    nexya_agency: [technical_sales, enterprise_sales, sales_general, sales_development, go_to_market, robotics_raas, ai_solutions]
    amundi: [commercial_strategy, strategy_consulting]
  direct_family_bonus: 30
  points_per_professional_hit: 8
  points_per_transferable_hit: 9
  # Skills a posting may ask for. aliases: regexes; verified when the profile lists the skill (or an alias).
  # advanced: specialized engineering expertise the profile does not claim (see AVOID list in docs/INDUSTRY_TRACK.md).
  skills:
    python: {aliases: ['\bpython\b']}
    power query / power bi: {aliases: ['power query', 'power bi']}
    excel: {aliases: ['\bexcel\b']}
    data analysis: {aliases: ['data analy\w*', 'analy[sz]e data', 'industrial data']}
    kpi monitoring: {aliases: ['\bkpis?\b', 'performance indicators?', 'performance monitoring']}
    process improvement: {aliases: ['process improvement', 'process optimi[sz]ation', 'continuous improvement']}
    lean / 5s: {aliases: ['\blean\b', '\b5s\b', 'kaizen']}
    project management: {aliases: ['project management', 'project coordination', 'project planning']}
    stakeholder communication: {aliases: ['stakeholder', 'cross-functional']}
    automation: {aliases: ['process automation', 'workflow automation']}
    maintenance data / optimization: {aliases: ['maintenance data', 'maintenance kpis?', 'maintenance (process )?optimi[sz]ation', 'maintenance performance']}
    maintenance planning: {aliases: ['maintenance planning', 'preventive maintenance', 'maintenance scheduling']}
    inventory management: {aliases: ['inventory management', 'stock management']}
    six sigma: {aliases: ['six sigma', 'green belt', 'black belt']}
    sql: {aliases: ['\bsql\b']}
    cmms / gmao: {aliases: ['\bcmms\b', '\bgmao\b', 'sap pm\b', '\bmaximo\b']}
    sap: {aliases: ['\bsap\b']}
    matlab: {aliases: ['\bmatlab\b']}
    plc programming: {aliases: ['\bplcs?\b', 'siemens tia', 'ladder logic'], advanced: true}
    cad design: {aliases: ['\bcad\b', 'solidworks', '\bcatia\b', '\bcreo\b', 'siemens nx'], advanced: true}
    finite element analysis: {aliases: ['finite element', '\bfea\b', '\bansys\b', 'abaqus'], advanced: true}
    computational fluid dynamics: {aliases: ['\bcfd\b', 'computational fluid'], advanced: true}
    embedded systems: {aliases: ['embedded (systems?|software|c)', 'firmware', 'microcontroller'], advanced: true}
    control theory: {aliases: ['control theory', 'control systems? design', 'mpc\b', 'model predictive control'], advanced: true}
    ros / ros2: {aliases: ['\bros ?2?\b'], advanced: true}
    slam: {aliases: ['\bslam\b', 'localization and mapping'], advanced: true}
    computer vision: {aliases: ['computer vision', 'opencv', 'perception (algorithms?|stack|pipeline|systems?)', 'robot perception'], advanced: true}
    c++: {aliases: ['c\+\+'], advanced: true}
    electronics design: {aliases: ['pcb design', 'circuit design', 'electronics design', 'analog design'], advanced: true}
    semiconductor process engineering: {aliases: ['semiconductor (device|physics|process|fabrication|manufacturing process)', 'wafer (fab|processing)', 'lithography', 'cleanroom process'], advanced: true}
  level_weights: {mandatory: 3.0, preferred: 1.5, exposure: 0.5}
  unknown_technical_score: 60          # posting names no recognizable skill: neutral, flagged as unknown
  advanced_mandatory_penalty: 15       # per advanced skill that is mandatory and not verified (on the total)
  advanced_mandatory_cap: 35           # two or more such gaps cap the score here
  academic:
    base: 60                           # final-year engineering master's student
    field_match_points: 25
    field_keywords: [engineering, industrial, mechanical, robotics, automation, maintenance, manufacturing, mechatronics, aerospace, operations]
    maintenance_degree_points: 10      # BUT Genie Industriel et Maintenance
    phd_required_penalty: 40
    unrelated_field_penalty: 20
    unrelated_fields: [computer science, software engineering, electrical engineering, finance, accounting, law, chemistry, biology]
  industry:
    default: 40
    sectors: {90: [aerospace, aviation, aircraft, mro, airline, helicopter], 75: [manufacturing, industrial, logistics, supply chain, warehouse, plant, factory, maintenance],
              65: [robotics, automation, autonomous, iot, industry 4.0]}

# Ranking used for the industry & robotics track (only for opportunities not rejected).
industrial_priority:
  enabled: true                        # rank and notify track-B opportunities with this score
  weights: {recruitability: 0.40, career_fit: 0.35, networking: 0.25}

# Families not even fetched in detail at collection time (saves requests; editable).
skip_families_at_collection: [software_engineering, out_of_scope, design_engineering]

# Families outside the target path (tier 0) cannot score above base + alignment / 2,
# so a generic engineering internship is never pushed by keyword overlap alone.
tier0_fit_cap_base: 40

industry_signals:
  points_each: 3
  max_points: 10
  keywords: [enterprise, b2b, saas, cloud, artificial intelligence, ' ai ', machine learning, llm, generative,
             robotics, automation, fintech, payments, medtech, healthcare technology, medical device,
             industrial, iot, digital transformation, platform, api, data platform]

career_positive_signals:
  points_each: 3
  max_points: 12
  keywords: [consultative, solution selling, complex sales, strategic accounts, enterprise customers,
             technical demo, demonstrations, discovery, solution design, positioning, messaging,
             go-to-market, launch, competitive analysis, customer-facing, pre-sales, proof of concept]

mission_signals:
  base: 55
  positive_points: 4
  positive_max: 35
  negative_points: 8
  negative_max: 40
  positive: [cross-functional, strategy, strategic, ownership, own a project, mentor, executive,
             customer, launch, analysis, research, presentation, impact, real project, stakeholder,
             go-to-market, product, workshop, demo]
  negative: [administrative, data entry, filing, scheduling, reception, door-to-door, retail store,
             cashier, telemarketing, answering phones, coffee]

skill_development:
  base: 45
  technical: [ai, machine learning, cloud, api, data, platform, architecture, software, automation,
              technical, integration, saas, analytics, robotics]
  commercial: [customer, client, sales, pricing, market, partner, account, revenue, pipeline,
               negotiation, positioning, business case, roi]
  points_each: 4
  max_points: 55

long_term_value:
  base: 50
  watchlist_priority_points: {1: 35, 2: 25, 3: 15}
  structured_program_points: 10
  structured_program_keywords: [internship program, intern program, mentorship, mentor, return offer,
                                full-time conversion, graduate program, academy, cohort, training program]

experience_relevance:
  base: 30
  points_per_keyword: 5
  max_points: 70

cold_calling:
  # A position requiring more than `threshold_per_day` calls gets the major penalty.
  threshold_per_day: 30
  major_penalty: 35        # applied to career_alignment and mission_quality
  mention_penalty: 8       # "cold calling" mentioned without a volume
  high_volume_phrases: [high-volume cold calling, high volume cold calling, high volume of calls,
                        high-volume outbound, 100+ dials, smile and dial]
  structured_academy_relief: 10   # sales academy at a priority-1 watchlist company

duration:
  outside_preferred_penalty: 3
  outside_acceptable_penalty: 8

strategic_bypass:
  # Notify even below the threshold when: tier-1 family + priority-1 company + fit >= min_fit.
  min_fit: 70

priority:
  fit_weight: 0.75
  networking_weight: 0.25
  tiers:
    exceptional: 90
    high: 85
    review: 75
  notify_threshold: 50          # lowered 21 Oct 2026: see more, volume is fine (off-target families cap below 48)
  max_cards_per_digest: 0       # 0 = unlimited

networking_scores:
  hiring_manager_post: 100
  recruiter_post: 95
  team_member_post: 85
  named_recruiter_on_vacancy: 75
  recruiting_team: 50
  other_evidence: 40
  none: 20
  low_confidence_penalty: 15   # applied when contact confidence < 0.6

feedback:
  save_delta: 2
  applied_delta: 3
  dismiss_delta: -2
  reason_delta: -3
  min_adjustment: -15
  max_adjustment: 10

# Semantic classification from responsibilities (23 Oct 2026, V3). Used when the title is not
# conclusive: a vague or generic title takes the family its responsibilities describe best.
semantic:
  apply_when_title_family_in: [unclassified, marketing_general, data_analytics, strategy_consulting]
  min_hits: 3          # distinct responsibility cues needed
  min_margin: 2        # lead over the runner-up family
  families:
    technical_sales: [technical demo, product demonstrations, discovery calls, pre-sales, presales, solution design,
                      proof of concept, customer requirements, technical questions, rfp, solution architecture, customer solutions]
    robotics_raas: [robot deployment, deploy robots, robotic systems, fleet of robots, autonomous mobile robots, amr,
                    on-site deployment, commissioning, robot fleet, field deployment, robotics]
    maintenance_reliability: [preventive maintenance, corrective maintenance, maintenance planning, reliability, mtbf, mttr,
                              cmms, gmao, equipment availability, root cause analysis, failure analysis, spare parts, technical services]
    commercial_strategy: [sales strategy, commercial excellence, pricing strategy, sales performance, sales operations,
                          revenue growth, sales analytics, pipeline analysis, commercial performance]
    industrial_operations: [continuous improvement, lean, kaizen, 5s, oee, production line, shop floor, process optimization,
                            value stream, waste reduction, industrial performance, operational performance]
    industrial_project_management: [project planning, project schedule, gantt, milestones, stakeholder coordination,
                                    implementation project, customer implementation, go-live, deployment plan, project reporting,
                                    budget tracking]
    product_management: [product roadmap, user stories, backlog, product requirements, user research, feature prioritization]
    product_marketing: [positioning, messaging, launch plan, competitive analysis, sales enablement, value proposition]
    industrial_digital: [industry 4.0, digital twin, iiot, mes, scada, smart factory, industrial data, predictive maintenance model]

# Global application priority (V3). Initial, configurable weights; not validated probabilities.
global_priority:
  weights:
    exploration: {recruitability: 0.25, career_fit: 0.25, compensation: 0.15, networking: 0.10, quality: 0.15, urgency: 0.05, ease: 0.05}
    conversion: {recruitability: 0.30, career_fit: 0.20, compensation: 0.20, networking: 0.10, quality: 0.10, urgency: 0.05, ease: 0.05}
  default_mode: conversion
  unknown_compensation_penalty: 5      # points off a provisional score when pay is unknown
  unpaid_penalty: 25                   # confirmed unpaid (when unpaid internships are not excluded)
  unpaid_filtered_when_excluded: true  # include_unpaid_internships=false keeps them out of the ranked lists

# Application strategist (V3).
strategist:
  apply_now_priority: 70
  prepare_priority: 55
  low_priority_below: 40
  ambitious_recruitability_below: 60   # strong fit, weaker match: a stretch
  safety_recruitability_from: 82       # very strong match
  allocation: {AMBITIOUS: 0.25, TARGETED: 0.50, SAFETY: 0.25}
  ambitious_watchlist_priority: 1      # priority-1 companies with modest recruitability count as ambitious

# Recommendation ratings (V3). Same explainable, bounded learning as Save / Dismiss.
ratings:
  EXCELLENT: {delta: 3, label: Excellente}
  RELEVANT: {delta: 1, label: Pertinente}
  NOT_INTERESTING: {delta: -2, label: Pas intéressante}
  INELIGIBLE: {delta: 0, label: Inéligible, note: "reviewed by hand, never changes hard eligibility rules"}
  TOO_TECHNICAL: {delta: -2, label: Trop technique}
  COMPENSATION_TOO_LOW: {delta: -1, label: Rémunération trop basse}
  WRONG_LOCATION: {delta: -2, label: Mauvais lieu, dimension: country}
  WRONG_CAREER_PATH: {delta: -3, label: Mauvaise voie}
  min_ratings_before_adjusting: 3      # avoid overfitting to one or two ratings
