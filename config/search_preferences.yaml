# Search and geography preferences.

geography:
  # Hard personal exclusions (ISO2). Never expanded automatically.
  # Personal choices. 21 Oct 2026: South Asia (IN, PK, BD, LK), Russia, Ukraine, Turkey added at the
  # user's request. 23 Oct 2026: Africa (incl. Egypt) removed from the exclusions at the user's request
  # (V3: "Do not exclude African countries by default"); country safety checks still apply.
  excluded_countries: [FR, IL, IN, PK, BD, LK, RU, UA, TR]
  # Countries the user has personally decided to exclude for safety reasons.
  # Empty by default: nothing is added without the user's decision.
  safety_excluded_countries: []
  # Optional rule on stored official advisories (see `summer-hunter safety refresh`).
  # When true, a country whose advisory level is WHOLE_COUNTRY_ADVISED_AGAINST
  # (set manually after reading the France Diplomatie page) is rejected.
  exclude_whole_country_advised_against: true
  # Manual overrides: force-allow a country even if a rule would exclude it.
  # Hard personal exclusions (FR, IL) are only removed by editing excluded_countries.
  country_overrides_allow: []
  priority_countries:
    asia_pacific: [SG, HK, TW, JP, KR, AU, CN, VN, ID, TH]
    middle_east: [AE, QA]
    europe: [IE, GB, CH, DE, NL, SE, DK, 'NO', FI, BE, LU, ES, IT]
    north_america: [US, CA]
    # 23 Oct 2026: Africa is a full search region (discovery priorities, not an exhaustive list).
    africa: [MA, TN, EG, SN, CI, GH, NG, KE, RW, TZ, UG, ZA, BW, NA]
  priority_country_bonus: 2
  # Personal preference penalties on the career-fit score (not exclusions).
  # US: J-1 internship visa through a sponsor organisation is slow and costly (decided 21 Oct 2026).
  country_penalties: {US: -12}

# Title must look like an internship to be kept at collection time.
internship_title_patterns:
  - '\bintern(ship)?s?\b'
  - '\bstagiaire\b'
  - '\bstage\b'
  - '\bpraktikum\b'
  - '\bpraktikant(in)?\b'
  - '\bco-?op\b'
  - '\bsummer (analyst|associate)\b'
  - '\bplacement\b'
  - '\binternship program(me)?\b'

# Titles that disqualify the record at collection time (not internships).
excluded_title_patterns:
  - '\bapprentice(ship)?\b'
  - '\balternan(ce|t)\b'
  - '\bworking student\b'
  - '\bwerkstudent(in)?\b'
  - '\bvolunteer\b'
  - '\bph\.?d\.?\b'
  - '\bpostdoc'
  - '\bhigh school\b'
  - '\bsenior\b'
  - '\bprincipal\b'
  - '\bdirector\b'
  - '\bmanager, \b'   # people-manager titles such as "Manager, Sales Engineering"

# Search phrases used by search-API discovery (LinkedIn public posts and jobs).
# Two parallel tracks. `allocation` splits the per-run query budget between them; queries rotate
# from one run to the next so every phrase is used over time. Allocation shares effort only:
# scores are never adjusted to balance the number of recommendations.
discovery:
  max_queries_per_run: 30
  results_per_query: 10
  allocation: {business_tech: 0.5, industry_robotics: 0.5}
  add_yearless_variants: true      # also search each job phrase without "2027" (dates still checked)
  # Share of each track's queries spent on job listings (the rest on posts / early signals), per mode.
  job_share_by_mode: {conversion: 0.7, exploration: 0.4}
  tracks:
    business_tech:
      post_queries:
        - '"summer 2027" intern hiring "solutions engineer"'
        - '"summer 2027" internship "product marketing"'
        - '"2027" internship "sales engineer" hiring'
        - '"my team is hiring" intern 2027'
        - '"we''re hiring" interns "summer 2027"'
        - '"2027 internship" "business development"'
        - '"internship" 2027 "go-to-market" hiring'
        - '"internship opportunities in Singapore" 2027'
        - '"nous recrutons" stagiaire 2027 "business developer"'
        - '"stage" "avril 2027" "avant-vente"'
        - '"stage" 2027 "business developer" Casablanca OR Rabat OR Tunis'
        - '"internship" 2027 "business development" Lagos OR Nairobi OR Kigali'
        - '"stage" 2027 "ingénieur commercial" Dakar OR Abidjan'
      job_queries:
        - 'intern 2027 "solutions engineer"'
        - 'intern 2027 "sales engineer"'
        - 'intern 2027 "product marketing"'
        - 'internship 2027 "technical sales"'
        - 'internship 2027 "business development"'
        - 'internship "sales engineer" Morocco'
        - 'stage "ingénieur avant-vente" Maroc'
        - 'internship "product management" Nairobi OR Lagos OR "Cape Town"'
        - 'internship "solutions engineer" "South Africa" OR Kenya OR Egypt'
    industry_robotics:
      post_queries:
        - '"maintenance manager" hiring intern 2027'
        - '"robotics" "deployment" "hiring" intern 2027'
        - '"we''re hiring" "robotics operations" intern'
        - '"industrial project" intern hiring 2027'
        - '"MRO" internship hiring 2027'
        - '"engineering manager" "summer 2027" intern manufacturing'
        - '"automation" "internship" 2027 "we''re hiring"'
        - '"robotics as a service" hiring intern'
        - '"Praktikum" 2027 "Instandhaltung"'
        - '"stage" 2027 "maintenance" aéronautique international'
        - '"stage" 2027 "maintenance" Casablanca OR Tanger OR Tunis'
        - '"internship" 2027 maintenance OR "project engineer" Johannesburg OR "Cape Town" OR Nairobi'
      job_queries:
        - '"Industrial Project Management" internship 2027'
        - '"Maintenance Engineering" summer internship 2027'
        - '"Reliability Engineering" intern summer 2027'
        - '"Robotics Deployment" internship 2027'
        - '"Robotics Operations" intern 2027'
        - '"Robotics as a Service" internship 2027'
        - '"Industrial Automation" project intern 2027'
        - '"Operational Excellence" summer intern 2027'
        - '"Maintenance Planning" intern 2027'
        - '"Industry 4.0" internship 2027'
        - '"Manufacturing Project Management" intern 2027'
        - '"Robotics Customer Success" internship 2027'
        - '"Industrial Digitalization" internship 2027'
        - '"Continuous Improvement" intern 2027'
        - '"Project Engineer" intern 2027'
        - '"MRO" intern 2027'
        - '"Instandhaltung" Praktikum 2027'
        - 'stage "maintenance industrielle" Maroc'
        - 'stage "gestion de projet industriel" Maroc OR Tunisie OR Sénégal'
        - 'internship "maintenance engineering" "South Africa" OR Kenya OR Egypt'
        - 'internship "supply chain" OR logistics Casablanca OR Lagos OR Nairobi'
        - 'stage "industrie 4.0" OR automatisation Maroc'
