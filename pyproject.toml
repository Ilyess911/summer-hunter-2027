[project]
name = "summer-hunter-2027"
version = "1.0.0"
description = "Personal internship intelligence agent: discovers, filters and ranks international internships for April-August 2027."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "python-dotenv>=1.0",
    "anthropic>=1.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "openpyxl>=3.1.5",
    "fastapi>=0.162.0",
]

[project.scripts]
summer-hunter = "summer_hunter.cli:main"

[project.optional-dependencies]
hosted = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summer_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real public endpoints (run with -m live)",
]
addopts = "-m 'not live'"
