<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summer Hunter</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="home">
  <header class="hero">
    <div class="hero-row">
      <h1>Summer Hunter</h1>
      <span class="season">Avr. – août 2027</span>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><b id="s-target">–</b><span>en cible</span></div>
      <div class="stat"><b id="s-new">–</b><span>à traiter</span></div>
      <div class="stat"><b id="s-saved">–</b><span>sauvés</span></div>
      <div class="stat"><b id="s-applied">–</b><span>postulés</span></div>
    </div>
  </header>
  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Rôle, entreprise, ville" autocomplete="off">
    </label>
    <div class="segmented" id="tabs" role="tablist">
      <button data-view="new" class="on" role="tab">Nouveaux</button>
      <button data-view="top" role="tab">Top</button>
      <button data-view="saved" role="tab">Sauvés</button>
      <button data-view="applied" role="tab">Postulés</button>
      <button data-view="rejected" role="tab">Rejetés</button>
    </div>
    <div class="chips-row" id="regions">
      <button data-region="" class="on">Tout</button>
      <button data-region="europe">Europe</button>
      <button data-region="asia">Asie-Pacifique</button>
      <button data-region="middle_east">Moyen-Orient</button>
      <button data-region="americas">Amériques</button>
    </div>
  </div>
  <main id="list" aria-live="polite"></main>
</div>
<section id="detail" hidden></section>
<div id="toast" role="status" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
